spring:
  datasource:
    # Local dev defaults for JobVault
    url: jdbc:postgresql://localhost:5432/jobvault
    username: YOUR_DB_USERNAME
    password: YOUR_DB_PASSWORD
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Baseline at version 0 so fresh environments still execute V1+.
    # For pre-existing databases, override this to the schema's current migration version.
    baseline-version: 0
  mvc:
    cors:
      allowed-origins:
        - http://localhost:5173
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
        - Accept
        - Origin
        - X-CSRF-Token
      allow-credentials: true
      max-age: 3600
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
